<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AE Comp Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e4e4e7;min-height:100vh;display:flex}
.sidebar{width:440px;min-width:280px;max-width:70vw;border-right:1px solid #27272a;display:flex;flex-direction:column;height:100vh;overflow:hidden;resize:horizontal}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sidebar-header{padding:16px 20px;border-bottom:1px solid #27272a}
.sidebar-header h1{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sidebar-header p{font-size:11px;color:#71717a}
.sidebar-body{flex:1;overflow-y:auto;padding:0}
.section{border-bottom:1px solid #27272a;padding:14px 20px}
.section.collapsed-section{padding:10px 20px;cursor:pointer;transition:background 0.15s}
.section.collapsed-section:hover{background:#18181b}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-header.collapsed-header{margin-bottom:0}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;display:flex;align-items:center;gap:6px;cursor:pointer}
.section-hint{font-size:11px;color:#52525b;margin-bottom:8px;line-height:1.4}
.collapsed-hint{font-size:10px;color:#3f3f46;font-style:italic}
.header-right{display:flex;align-items:center;gap:6px}
.tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tag{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;cursor:default}
.tag-remove{background:none;border:none;color:inherit;cursor:pointer;font-size:13px;opacity:0.5;padding:0 0 0 2px;line-height:1}
.tag-remove:hover{opacity:1}
.input-row{display:flex;gap:5px}
.input-row input{flex:1;background:#18181b;border:1px solid #3f3f46;border-radius:7px;padding:6px 10px;font-size:11px;color:#e4e4e7;outline:none}
.input-row input:focus{border-color:#52525b}
.input-row input::placeholder{color:#52525b}
.btn-add{background:#27272a;border:1px solid #3f3f46;border-radius:7px;padding:6px 10px;color:#a1a1aa;cursor:pointer;font-size:11px;white-space:nowrap;transition:all 0.15s}
.btn-add:hover{background:#3f3f46;color:#e4e4e7}
.btn-clear{background:none;border:1px solid #3f3f46;border-radius:5px;padding:2px 8px;color:#71717a;cursor:pointer;font-size:10px;transition:all 0.15s}
.btn-clear:hover{border-color:#71717a;color:#a1a1aa}
.suffix-row{display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 10px;background:#18181b;border:1px solid #27272a;border-radius:7px}
.suffix-row label{font-size:10px;color:#71717a;white-space:nowrap}
.suffix-row input{flex:1;background:#0a0a0a;border:1px solid #3f3f46;border-radius:4px;padding:3px 8px;font-size:11px;color:#fbbf24;font-family:'SF Mono','Consolas',monospace;outline:none}
.suffix-row input:focus{border-color:#52525b}
.suffix-row input::placeholder{color:#3f3f46}
.tier-card{background:#111113;border:1px solid #27272a;border-radius:9px;margin-bottom:6px;overflow:hidden}
.tier-header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #1e1e20}
.tier-label{font-size:11px;font-weight:700;flex:1}
.tier-actions{display:flex;gap:2px;align-items:center}
.tier-btn{background:none;border:1px solid #3f3f46;border-radius:4px;padding:2px 6px;color:#52525b;cursor:pointer;font-size:10px;transition:all 0.15s;line-height:1}
.tier-btn:hover{color:#a1a1aa;border-color:#52525b}
.tier-btn:disabled{opacity:0.15;cursor:default}
.tier-btn.remove{color:#f87171;border-color:#7f1d1d}
.tier-btn.remove:hover{background:rgba(127,29,29,0.15)}
.tier-body{padding:8px 10px}
.tier-comps{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tier-comp-tag{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;font-family:'SF Mono','Consolas',monospace;cursor:default}
.tier-settings-row{padding:4px 10px;border-bottom:1px solid #1e1e20;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tier-settings-row label{font-size:9px;color:#71717a;display:flex;align-items:center;gap:3px;cursor:pointer}
.tier-settings-row input[type="checkbox"]{accent-color:#22d3ee;width:11px;height:11px;cursor:pointer}
.tier-settings-row input[type="number"]{background:#0a0a0a;border:1px solid #3f3f46;border-radius:3px;padding:2px 4px;font-size:10px;color:#e4e4e7;width:48px;outline:none}
.tier-settings-row input[type="number"]:focus{border-color:#52525b}
.tier-settings-row .mirror-summary{font-size:9px;color:#3f3f46;font-style:italic}
.settings-panel{padding:8px 10px;border-bottom:1px solid #1e1e20}
.settings-panel .comp-settings{margin-top:0}
.source-row{display:flex;align-items:center;gap:6px;padding:4px 0;flex-wrap:wrap}
.source-comp-label{font-size:10px;font-weight:600;color:#a1a1aa;min-width:60px;font-family:'SF Mono','Consolas',monospace}
.source-chips{display:flex;gap:3px;flex-wrap:wrap}
.source-hint{font-size:10px;color:#3f3f46;font-style:italic;padding:2px 0}
.global-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#111113;border:1px solid #27272a;border-radius:7px;margin-bottom:4px;flex-wrap:wrap}
.global-top{display:flex;align-items:center;gap:8px;width:100%}
.global-name{font-size:12px;font-weight:600;color:#fb7185;flex-shrink:0}
.global-arrow{font-size:10px;color:#3f3f46;flex-shrink:0}
.global-targets{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.guide-check{display:flex;align-items:center;gap:4px;flex-shrink:0}
.guide-check input{accent-color:#fb7185;width:12px;height:12px;cursor:pointer}
.guide-check label{font-size:9px;color:#71717a;cursor:pointer}
.target-chip{font-size:10px;padding:2px 6px;border-radius:4px;cursor:pointer;border:1px solid #3f3f46;color:#52525b;transition:all 0.15s;user-select:none;background:transparent}
.target-chip:hover{color:#a1a1aa;border-color:#52525b}
.target-chip.active{background:rgba(255,255,255,0.08);color:#d4d4d8;border-color:#71717a}
.target-sep{width:1px;height:14px;background:#27272a;flex-shrink:0;margin:0 1px}
.settings-check{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 10px;background:#18181b;border-radius:7px;border:1px solid #27272a}
.settings-check label{display:flex;align-items:center;gap:8px;font-size:11px;color:#a1a1aa;cursor:pointer;flex:1}
.settings-check input[type="checkbox"]{accent-color:#22d3ee;width:14px;height:14px;cursor:pointer}
.comp-settings{display:flex;gap:8px;flex-wrap:wrap;padding:8px 10px;background:#18181b;border-radius:7px;border:1px solid #27272a;margin-top:6px}
.comp-settings label{font-size:10px;color:#71717a;display:flex;align-items:center;gap:4px}
.comp-settings input{background:#0a0a0a;border:1px solid #3f3f46;border-radius:4px;padding:3px 6px;font-size:11px;color:#e4e4e7;width:55px;outline:none}
.comp-settings input:focus{border-color:#52525b}
.output-section{padding:14px 20px;border-top:1px solid #27272a}
.btn-export{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#7c3aed;color:white;display:flex;align-items:center;justify-content:center;gap:8px;transition:background 0.15s}
.btn-export:hover:not(:disabled){background:#8b5cf6}
.btn-export:disabled{background:#3f3f46;color:#71717a;cursor:not-allowed}
.help{font-size:10px;color:#52525b;margin-top:6px;text-align:center}
.preview-header{padding:10px 20px;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.preview-header h2{font-size:13px;font-weight:600}
.badge{font-size:11px;background:#27272a;color:#a1a1aa;padding:2px 10px;border-radius:10px}
.preview-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#3f3f46;gap:8px;font-family:-apple-system,sans-serif}
.preview-empty span{font-size:32px}
.preview-empty p{font-size:13px}
.fi{width:17px;height:17px;flex-shrink:0}
.fi-sm{width:13px;height:13px;flex-shrink:0}
.view-tabs{display:flex;gap:2px;background:#18181b;border-radius:7px;padding:2px;border:1px solid #27272a}
.view-tab{font-size:11px;padding:4px 10px;border-radius:5px;cursor:pointer;color:#52525b;border:none;background:none;font-weight:500;transition:all 0.15s}
.view-tab:hover{color:#a1a1aa}
.view-tab.active{color:#e4e4e7;background:#27272a}
.main-view-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
.sunburst-container{flex:1;overflow:auto;position:relative;padding:24px;display:flex;align-items:center;justify-content:center}
.dag-wrap{display:inline-flex;flex-direction:column;align-items:center;min-width:max-content;position:relative}
.dag-shot-row{display:flex;align-items:center;gap:0;position:relative}
.dag-globals-row{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 40px 0;border-top:1px dashed #27272a;margin-top:16px;width:100%}
.dag-globals-nodes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.dag-col-sublabel{font-size:10px;color:#3f3f46;margin-top:-4px;margin-bottom:8px;text-align:center}
.dag-column{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:150px;padding:0 40px}
.dag-col-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#52525b;margin-bottom:8px;text-align:center}
.dag-node{padding:8px 16px;border-radius:9px;font-size:13px;white-space:nowrap;border:1px solid #27272a;background:#18181b;display:inline-flex;align-items:center;gap:7px;position:relative;z-index:1}
.dag-node.root-node{border-color:rgba(251,191,36,0.4);color:#fbbf24}
.dag-node.precomp-node{border-color:rgba(52,211,153,0.4);color:#34d399}
.dag-node.global-node{border-color:rgba(251,113,133,0.4);color:#fb7185;font-size:12px;padding:7px 14px}
.dag-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible}
.dag-svg path{fill:none;stroke:#3f3f46;stroke-width:1.5}
.dag-svg path.global-line{stroke:#fb718540;stroke-dasharray:5,4;stroke-width:1.5}
.dag-count{font-size:11px;color:#52525b;margin-left:4px;font-weight:normal}
.tree-container{flex:1;overflow:auto;padding:12px 20px;font-family:'SF Mono','Consolas',monospace;font-size:12px}
.tree-row{display:flex;align-items:center;gap:4px;padding:1.5px 0;white-space:nowrap;cursor:pointer;border-radius:3px}
.tree-row:hover{background:rgba(255,255,255,0.03)}
.tree-toggle{width:14px;flex-shrink:0;text-align:center;font-size:9px;color:#52525b;transition:transform 0.15s}
.tree-toggle.open{transform:rotate(90deg)}
.tree-toggle.leaf{visibility:hidden}
.tc{color:#3f3f46;width:16px;flex-shrink:0;text-align:center;font-size:10px}
.drag-grip{cursor:grab;color:#3f3f46;font-size:14px;user-select:none;padding:0 4px;line-height:1}
.drag-grip:hover{color:#71717a}
.dragging{opacity:0.4}
.drag-over-top{border-top:2px solid #3b82f6 !important}
.drag-over-bottom{border-bottom:2px solid #3b82f6 !important}
.global-targets .target-chip.active{background:rgba(251,113,133,0.12);color:#fb7185;border-color:rgba(251,113,133,0.3)}
.group-toggle{display:flex;gap:2px;background:#18181b;border-radius:6px;padding:2px;border:1px solid #27272a}
.group-toggle span{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;color:#52525b;font-weight:500;transition:all 0.15s;white-space:nowrap}
.group-toggle span:hover{color:#a1a1aa}
.group-toggle span.active{color:#e4e4e7;background:#27272a}
@media(max-width:900px){body{flex-direction:column}.sidebar{width:100%;min-width:0;height:auto;max-height:50vh;border-right:none;border-bottom:1px solid #27272a}.main{height:50vh}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <h1>🎬 AE Comp Builder</h1>
    <p>Build comp pipelines, export as ExtendScript.</p>
  </div>
  <div class="sidebar-body" id="sidebarBody"></div>
  <div class="output-section">
    <button class="btn-export" id="exportBtn" onclick="exportScript()" disabled>📜 Generate ExtendScript</button>
    <p class="help">Run in After Effects: File → Scripts → Run Script File</p>
  </div>
</div>
<div class="main">
  <div class="preview-header">
    <div style="display:flex;align-items:center;gap:8px">
      <h2>Preview</h2>
      <span class="badge" id="countBadge">0 items</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="view-tabs">
        <button class="view-tab active" onclick="setMainView('pipeline')">Pipeline</button>
        <button class="view-tab" onclick="setMainView('structure')">Project Structure</button>
      </div>
    </div>
  </div>
  <div class="main-view-area">
    <div id="pipelineView" class="sunburst-container">
      <div class="dag-wrap" id="htreeWrap"></div>
    </div>
    <div id="structureView" style="display:none;flex:1;overflow:hidden;display:none;flex-direction:column">
      <div style="padding:8px 20px;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
        <div class="group-toggle" id="groupToggle">
          <span class="active" onclick="setGroupMode('shot')">Group by Shot</span>
          <span onclick="setGroupMode('tier')">Group by Tier</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <button onclick="expandAllTree()" style="background:none;border:1px solid #3f3f46;border-radius:5px;padding:2px 8px;color:#71717a;cursor:pointer;font-size:10px;transition:all 0.15s" onmouseover="this.style.color='#a1a1aa'" onmouseout="this.style.color='#71717a'">Expand</button>
          <button onclick="collapseAllTree()" style="background:none;border:1px solid #3f3f46;border-radius:5px;padding:2px 8px;color:#71717a;cursor:pointer;font-size:10px;transition:all 0.15s" onmouseover="this.style.color='#a1a1aa'" onmouseout="this.style.color='#71717a'">Collapse</button>
        </div>
      </div>
      <div class="tree-container" id="treeContainer">
        <div class="preview-empty"><span>📂</span><p>Your AE project structure will appear here</p></div>
      </div>
    </div>
  </div>
</div>

<script>
// ========== COLORS ==========
const COLORS=[
  {name:"amber",dot:"#fbbf24",text:"#fbbf24",tagBg:"rgba(251,191,36,0.12)",tagBorder:"rgba(251,191,36,0.2)"},
  {name:"blue",dot:"#60a5fa",text:"#60a5fa",tagBg:"rgba(96,165,250,0.12)",tagBorder:"rgba(96,165,250,0.2)"},
  {name:"green",dot:"#34d399",text:"#34d399",tagBg:"rgba(52,211,153,0.12)",tagBorder:"rgba(52,211,153,0.2)"},
  {name:"purple",dot:"#c084fc",text:"#c084fc",tagBg:"rgba(192,132,252,0.12)",tagBorder:"rgba(192,132,252,0.2)"},
  {name:"rose",dot:"#fb7185",text:"#fb7185",tagBg:"rgba(251,113,133,0.12)",tagBorder:"rgba(251,113,133,0.2)"},
  {name:"cyan",dot:"#22d3ee",text:"#22d3ee",tagBg:"rgba(34,211,238,0.12)",tagBorder:"rgba(34,211,238,0.2)"},
];
const SHOT_COL=COLORS[0],TIER_COL=COLORS[2],GLOB_COL=COLORS[4];

// ========== STATE ==========
let shots=[],rootSuffix='',rootDisplayLabel=null;
let tiers=[],tierIdCounter=0,compIdCounter=0;
let globals=[],globalIdCounter=0;
let settings={wrapInFolder:true,width:1920,height:1080,fps:30,duration:10};
let editingTag=null,sectionOpen={shots:true,tiers:true,globals:true};
let rootSettingsOpen=false,tierSettingsOpen=new Set(),globalSettingsOpen=false;
let globalSettings={width:1920,height:1080,fps:30,duration:10,mirrorRoot:true,wrapInFolder:false};
let treeCollapsed={};
let mainView='pipeline'; // 'pipeline' or 'structure'
let groupMode='shot'; // 'shot' or 'tier'

// ========== HELPERS ==========
function tierById(id){return tiers.find(t=>t.id===id)}
function compById(id){for(const t of tiers)for(const c of t.comps)if(c.id===id)return c;return null}
function tierOfComp(cid){return tiers.find(t=>t.comps.some(c=>c.id===cid))}
function getEffectiveSources(comp,ti){if(comp.sources.length)return comp.sources;if(ti===0)return['root'];return tiers[ti-1].comps.map(c=>c.id)}
function tierColor(ti){return COLORS[(ti+1)%COLORS.length]}
function getAllCompOptions(){
  const o=[{id:'root',label:rootSuffix?rootSuffix.replace(/^_/,''):(rootDisplayLabel||'Root'),tierLabel:rootDisplayLabel||'Root'}];
  tiers.forEach((t,i)=>t.comps.forEach(c=>o.push({id:c.id,label:c.label,tierLabel:t.name||('Group '+(i+1))})));return o;
}
function validateAllSources(){tiers.forEach((t,i)=>{const v=new Set(['root']);if(i>0)tiers[i-1].comps.forEach(c=>v.add(c.id));t.comps.forEach(c=>{c.sources=c.sources.filter(s=>v.has(s))})})}
function makeTierSettings(){return{width:settings.width,height:settings.height,fps:settings.fps,duration:settings.duration,mirrorRoot:true}}
function getTierSettings(t){if(!t.settings||t.settings.mirrorRoot)return{width:settings.width,height:settings.height,fps:settings.fps,duration:settings.duration};return{width:t.settings.width,height:t.settings.height,fps:t.settings.fps,duration:t.settings.duration}}
function syncMirroredTiers(){tiers.forEach(t=>{if(t.settings&&t.settings.mirrorRoot){t.settings.width=settings.width;t.settings.height=settings.height;t.settings.fps=settings.fps;t.settings.duration=settings.duration}})}
function updateTierSetting(id,k,val){const t=tierById(id);if(t){t.settings[k]=val;renderAll()}}
function toggleTierMirrorRoot(id){const t=tierById(id);if(!t)return;t.settings.mirrorRoot=!t.settings.mirrorRoot;if(t.settings.mirrorRoot){t.settings.width=settings.width;t.settings.height=settings.height;t.settings.fps=settings.fps;t.settings.duration=settings.duration}renderAll()}
function toggleTierFolder(id){const t=tierById(id);if(t)t.wrapInFolder=!t.wrapInFolder;renderAll()}
function san(n){return n.replace(/[<>:"/\\|?*]/g,"_").trim()}
function pi(raw){return raw.split(/[\n\r\t,]+/).map(s=>s.trim()).filter(Boolean).map(san).filter(Boolean)}
function esc(s){return s.replace(/'/g,"\\'").replace(/\\/g,"\\\\")}
function natSort(a){return[...a].sort((x,y)=>x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'}))}
document.addEventListener('paste',function(e){const el=document.activeElement;if(el&&el.tagName==='INPUT'&&el.id&&el.id.startsWith('inp-')){const txt=(e.clipboardData||window.clipboardData).getData('text');if(txt.includes('\n')||txt.includes('\r')||txt.includes('\t')){e.preventDefault();el.value=txt;el.dataset.rawPaste=txt}}});

// ========== TAG EDITING ==========
function startEditShot(i){editingTag={type:'shot',idx:i};renderAll()}
function startEditGlobal(i){editingTag={type:'global',idx:i};renderAll()}
function startEditCompSuffix(id){editingTag={type:'compSuffix',compId:id};renderAll()}
function startEditTierName(id){editingTag={type:'tierName',tierId:id};renderAll()}
function startEditRootName(){sectionOpen.shots=true;editingTag={type:'rootName'};renderAll()}
function commitEdit(el){
  if(!editingTag)return;const val=san(el.value.trim());
  if(editingTag.type==='shot'){if(val&&val!==shots[editingTag.idx]){if(!shots.includes(val))shots[editingTag.idx]=val}else if(!val)shots.splice(editingTag.idx,1)}
  else if(editingTag.type==='global'){if(val&&val!==globals[editingTag.idx].name){if(!globals.find(g=>g.name===val))globals[editingTag.idx].name=val}else if(!val)globals.splice(editingTag.idx,1)}
  else if(editingTag.type==='compSuffix'){const c=compById(editingTag.compId);if(c){let s=val;if(s&&!s.startsWith('_'))s='_'+s;c.suffix=s||'_unnamed';c.label=c.suffix.replace(/^_/,'').replace(/_/g,' ')}}
  else if(editingTag.type==='tierName'){const t=tierById(editingTag.tierId);if(t)t.name=val||null}
  else if(editingTag.type==='rootName'){rootDisplayLabel=val||null}
  editingTag=null;renderAll();
}
function cancelEdit(){editingTag=null;renderAll()}
function editKeyHandler(e){if(e.key==='Enter'){e.preventDefault();commitEdit(e.target)}else if(e.key==='Escape')cancelEdit()}

// ========== OPERATIONS ==========
function addShot(){const inp=document.getElementById('inp-shots');if(!inp)return;pi(inp.dataset.rawPaste||inp.value).forEach(v=>{if(!shots.includes(v))shots.push(v)});inp.value='';delete inp.dataset.rawPaste;renderAll()}
function removeShot(i){shots.splice(i,1);renderAll()}
function clearShots(){shots=[];renderAll()}
function updateRootSuffix(val){let s=san(val.trim());if(s&&!s.startsWith('_'))s='_'+s;rootSuffix=s;renderAll()}
function addTier(){const t={id:'tier_'+tierIdCounter++,name:null,comps:[],wrapInFolder:false,settings:makeTierSettings()};tiers.push(t);renderAll();requestAnimationFrame(()=>{const inp=document.getElementById('inp-tier-comp-'+t.id);if(inp)inp.focus()})}

function renderDAGView(){
  const container=document.getElementById('htreeWrap');
  const hasContent=shots.length||globals.length||tiers.some(t=>t.comps.length>0);
  if(!hasContent){container.innerHTML=`<div class="preview-empty"><span>🎬</span><p>Add comps and precomps to build your AE pipeline</p></div>`;return}
  const shotLabel=shots.length?shots[0]:'{Shot}';
  const hasGlobals=globals.length>0;
  let html=`<div class="dag-shot-row" id="dag-row">`;
  html+=`<div class="dag-column"><div class="dag-col-label" style="color:#fbbf24">${rootDisplayLabel||'Root'}</div>`;
  if(shots.length)html+=`<div class="dag-col-sublabel">${shots.length} comp${shots.length!==1?'s':''}</div>`;
  html+=`<div class="dag-node root-node" data-dag-id="root">${compSVG('#fbbf24')} ${shotLabel+rootSuffix}${shots.length?`<span class="dag-count">× ${shots.length}</span>`:''}</div></div>`;
  tiers.forEach((tier,ti)=>{
    if(!tier.comps.length)return;const col=tierColor(ti);
    html+=`<div class="dag-column"><div class="dag-col-label" style="color:${col.dot}">${tier.name||('Group '+(ti+1))}</div>`;
    const nc=shots.length?tier.comps.length*shots.length:tier.comps.length;
    html+=`<div class="dag-col-sublabel">${shots.length?`${tier.comps.length} × ${shots.length} = ${nc} nested`:`${tier.comps.length} comp${tier.comps.length!==1?'s':''}`}</div>`;
    tier.comps.forEach(comp=>{
      const sources=getEffectiveSources(comp,ti);
      html+=`<div class="dag-node precomp-node" data-dag-id="${comp.id}" data-dag-sources="${sources.join(',')}" style="border-color:${col.dot}66;color:${col.dot}">${compSVG(col.dot)} ${shotLabel+comp.suffix}${shots.length?`<span class="dag-count">× ${shots.length}</span>`:''}</div>`;
    });
    html+=`</div>`;
  });
  if(hasGlobals){
    html+=`</div><div class="dag-globals-row" id="dag-globals-row"><div class="dag-col-label" style="color:#fb7185">Globals</div><div class="dag-col-sublabel">${globals.length} comp${globals.length!==1?'s':''}</div><div class="dag-globals-nodes">`;
    globals.forEach(g=>{const targets=g.targetComps.filter(tid=>tid==='root'||compById(tid));if(targets.length){const gc=targets.length*Math.max(shots.length,1);html+=`<div class="dag-node global-node" data-dag-id="${g.id}" data-dag-global-targets="${targets.join(',')}">${globSVG('#fb7185')} ${g.name}${g.guideLayer?' (guide)':''}${gc?`<span class="dag-count">× ${gc}</span>`:''}</div>`}});
    html+=`</div></div><svg class="dag-svg" id="dag-globals-svg"></svg>`;
  } else {html+=`</div>`}
  html+=`<svg class="dag-svg" id="dag-svg" style="position:absolute;top:0;left:0"></svg>`;
  container.innerHTML=html;requestAnimationFrame(drawDAGLines);
}

// ========== PROJECT STRUCTURE TREE ==========
function buildFolderTree(){
  const root={name:'Project',children:[],type:'root'};

  if(groupMode==='shot'){
    // --- GROUP BY SHOT (original behavior + global folder option) ---
    if(globalSettings.wrapInFolder&&globals.length){
      const gFolder={name:'Global Comps',type:'folder',children:[]};
      globals.forEach(g=>{gFolder.children.push({name:g.name,type:'global',children:[]})});
      root.children.push(gFolder);
    } else {
      globals.forEach(g=>{root.children.push({name:g.name,type:'global',children:[]})});
    }
    natSort(shots).forEach(shotName=>{
      if(settings.wrapInFolder){
        const shotFolder={name:shotName,type:'folder',children:[]};
        shotFolder.children.push({name:shotName+rootSuffix,type:'rootComp',children:[]});
        tiers.forEach((tier,ti)=>{
          if(!tier.comps.length)return;
          if(tier.wrapInFolder){
            const tierFolder={name:tier.name||('Group '+(ti+1)),type:'folder',children:[],tierIdx:ti};
            tier.comps.forEach(comp=>{tierFolder.children.push({name:shotName+comp.suffix,type:'precomp',children:[],tierIdx:ti})});
            shotFolder.children.push(tierFolder);
          } else {
            tier.comps.forEach(comp=>{shotFolder.children.push({name:shotName+comp.suffix,type:'precomp',children:[],tierIdx:ti})});
          }
        });
        root.children.push(shotFolder);
      } else {
        root.children.push({name:shotName+rootSuffix,type:'rootComp',children:[]});
        tiers.forEach((tier,ti)=>{
          tier.comps.forEach(comp=>{root.children.push({name:shotName+comp.suffix,type:'precomp',children:[],tierIdx:ti})});
        });
      }
    });
  } else {
    // --- GROUP BY TIER ---
    // Global comps folder
    if(globals.length){
      if(globalSettings.wrapInFolder){
        const gFolder={name:'Global Comps',type:'folder',children:[]};
        globals.forEach(g=>{gFolder.children.push({name:g.name,type:'global',children:[]})});
        root.children.push(gFolder);
      } else {
        globals.forEach(g=>{root.children.push({name:g.name,type:'global',children:[]})});
      }
    }
    // Root comps folder
    if(shots.length){
      const rootLabel=rootDisplayLabel||'Root';
      const rootFolder={name:rootLabel,type:'folder',children:[]};
      natSort(shots).forEach(shotName=>{
        rootFolder.children.push({name:shotName+rootSuffix,type:'rootComp',children:[]});
      });
      root.children.push(rootFolder);
    }
    // Tier folders
    tiers.forEach((tier,ti)=>{
      if(!tier.comps.length)return;
      const col=tierColor(ti);
      const tierFolder={name:tier.name||('Group '+(ti+1)),type:'folder',children:[],tierIdx:ti};
      natSort(shots).forEach(shotName=>{
        tier.comps.forEach(comp=>{
          tierFolder.children.push({name:shotName+comp.suffix,type:'precomp',children:[],tierIdx:ti});
        });
      });
      root.children.push(tierFolder);
    });
  }
  return root;
}

function countFolderItems(node){let f=0,c=0;function walk(n){if(n.type==='folder')f++;else if(n.type!=='root')c++;n.children.forEach(walk)}node.children.forEach(walk);return{folders:f,comps:c}}

function toggleTreeNode(path){treeCollapsed[path]=!treeCollapsed[path];renderProjectTree()}
function expandAllTree(){treeCollapsed={};renderProjectTree()}
function collapseAllTree(){
  const tree=buildFolderTree();treeCollapsed={};
  function mark(node,pp){const path=pp?pp+'/'+node.name:node.name;if(node.children.length)treeCollapsed[path]=true;node.children.forEach(ch=>mark(ch,path))}
  tree.children.forEach(ch=>mark(ch,''));renderProjectTree();
}

function renderProjectTree(){
  const box=document.getElementById('treeContainer');
  const tree=buildFolderTree();
  if(!tree.children.length){box.innerHTML=`<div class="preview-empty"><span>📂</span><p>Your AE project structure will appear here</p></div>`;updateTreeBadge(tree);return}

  let html='';
  function nodeIcon(n){
    if(n.type==='folder'){
      if(n.tierIdx!==undefined)return fSVG(tierColor(n.tierIdx).dot,'fi-sm');
      return fSVG('#fbbf24','fi-sm');
    }
    if(n.type==='global')return globSVG('#fb7185','fi-sm');
    if(n.type==='rootComp')return compSVG('#fbbf24','fi-sm');
    if(n.type==='precomp'){const col=n.tierIdx!==undefined?tierColor(n.tierIdx):{dot:'#34d399'};return compSVG(col.dot,'fi-sm')}
    return compSVG('#a1a1aa','fi-sm');
  }
  function nodeTextStyle(n){
    if(n.type==='folder'){
      if(n.tierIdx!==undefined)return`color:${tierColor(n.tierIdx).dot};font-weight:600`;
      return'color:#fafafa;font-weight:600';
    }
    if(n.type==='global')return'color:#fb7185;font-weight:normal';
    if(n.type==='rootComp')return'color:#fbbf24;font-weight:normal';
    if(n.type==='precomp'){const col=n.tierIdx!==undefined?tierColor(n.tierIdx):{dot:'#a1a1aa'};return`color:${col.dot};font-weight:normal`}
    return'color:#a1a1aa';
  }

  function renderNode(node,connectors,isLast,parentPath){
    if(node.type==='root'){node.children.forEach((ch,i)=>renderNode(ch,[],i===node.children.length-1,''));return}
    const path=parentPath?parentPath+'/'+node.name:node.name;
    const hasChildren=node.children.length>0;
    const isCollapsed=treeCollapsed[path]===true;
    let h=`<div class="tree-row" onclick="toggleTreeNode('${esc(path)}')">`;
    connectors.forEach(c=>{h+=`<span class="tc">${c}</span>`});
    if(hasChildren)h+=`<span class="tree-toggle ${isCollapsed?'':'open'}">▶</span>`;
    else h+=`<span class="tree-toggle leaf"></span>`;
    h+=nodeIcon(node)+` <span style="${nodeTextStyle(node)}">${node.name}</span>`;
    if(hasChildren&&isCollapsed){let cnt=0;function cntAll(nd){cnt++;nd.children.forEach(cntAll)}node.children.forEach(cntAll);h+=`<span style="font-size:10px;color:#3f3f46;margin-left:6px;font-family:-apple-system,sans-serif">(${cnt})</span>`}
    h+=`</div>`;
    html+=h;
    if(hasChildren&&!isCollapsed){
      node.children.forEach((ch,i)=>{
        const childIsLast=i===node.children.length-1;
        renderNode(ch,[...connectors,childIsLast?'\u00a0':'│'],childIsLast,path);
      });
    }
  }
  tree.children.forEach((ch,i)=>{renderNode(ch,[],i===tree.children.length-1,'');if(ch.type==='folder')html+=`<div style="height:2px"></div>`});
  box.innerHTML=html;updateTreeBadge(tree);
}

function updateTreeBadge(tree){
  const c=countFolderItems(tree);const parts=[];
  if(c.folders)parts.push(c.folders+' folder'+(c.folders!==1?'s':''));
  if(c.comps)parts.push(c.comps+' comp'+(c.comps!==1?'s':''));
  document.getElementById('countBadge').textContent=parts.join(' · ')||'0 items';
}

  if(c.comps)parts.push(c.comps+' comp'+(c.comps!==1?'s':''));
  document.getElementById('countBadge').textContent=parts.join(' · ')||'0 items';
  document.getElementById('exportBtn').disabled=shots.length===0;
}

  if(tso){
    h+=`<div class="settings-panel"><div class="tier-settings-row" style="border-bottom:none;padding:0">`;
    h+=`<label style="font-size:9px;color:#71717a;display:flex;align-items:center;gap:3px;cursor:pointer"><input type="checkbox" ${tier.wrapInFolder?'checked':''} onchange="toggleTierFolder('${tier.id}')" style="accent-color:${col.dot};width:11px;height:11px;cursor:pointer">Wrap in Folder</label>`;
    h+=`<label><input type="checkbox" ${ts.mirrorRoot?'checked':''} onchange="toggleTierMirrorRoot('${tier.id}')">Mirror Root</label>`;
    if(!ts.mirrorRoot){h+=`<label>W:<input type="number" value="${tset.width}" onchange="updateTierSetting('${tier.id}','width',parseInt(this.value)||1920)"></label><label>H:<input type="number" value="${tset.height}" onchange="updateTierSetting('${tier.id}','height',parseInt(this.value)||1080)"></label><label>FPS:<input type="number" value="${tset.fps}" step="0.01" onchange="updateTierSetting('${tier.id}','fps',parseFloat(this.value)||30)"></label><label>Dur:<input type="number" value="${tset.duration}" onchange="updateTierSetting('${tier.id}','duration',parseFloat(this.value)||10)">s</label>`}
    else h+=`<span class="mirror-summary">${tset.width}×${tset.height} ${tset.fps}fps ${tset.duration}s</span>`;
    h+=`</div></div>`;
  }
  h+=`<div class="tier-body">`;
  if(tier.comps.length){h+=`<div class="tier-comps">`;tier.comps.forEach(comp=>{const isE=editingTag&&editingTag.type==='compSuffix'&&editingTag.compId===comp.id;if(isE)h+=`<span class="tier-comp-tag" style="background:${col.tagBg};color:${col.text};border:1px solid ${col.tagBorder};padding:0"><input type="text" id="edit-tag" value="${comp.suffix}" onkeydown="editKeyHandler(event)" onblur="commitEdit(this)" style="background:transparent;border:none;color:${col.text};font-size:11px;padding:3px 8px;width:${Math.max(50,comp.suffix.length*7+16)}px;outline:none;font-family:'SF Mono','Consolas',monospace"></span>`;else h+=`<span class="tier-comp-tag" style="background:${col.tagBg};color:${col.text};border:1px solid ${col.tagBorder}" ondblclick="startEditCompSuffix('${comp.id}')">${comp.suffix}<button class="tag-remove" onclick="removeCompFromTier('${comp.id}')">&times;</button></span>`});h+=`</div>`}
  if(ti>0&&tier.comps.length){
    const avail=[{id:'root',label:rootDisplayLabel||'Root'}];if(prev)prev.comps.forEach(c=>avail.push({id:c.id,label:c.label}));
    tier.comps.forEach(comp=>{h+=`<div class="source-row"><span class="source-comp-label" style="color:${col.dot}">${comp.suffix}</span><div class="source-chips">`;avail.forEach(src=>{const active=comp.sources.includes(src.id),isDef=comp.sources.length===0,defActive=isDef&&src.id!=='root';h+=`<span class="target-chip ${active||defActive?'active':''}" onclick="toggleCompSource('${comp.id}','${src.id}')">${src.label}</span>`});h+=`</div></div>`});
  } else if(ti===0&&tier.comps.length)h+=`<div class="source-hint">Sources from Root comp</div>`;
  h+=`<div class="input-row" style="margin-top:4px"><input type="text" id="inp-tier-comp-${tier.id}" placeholder="Suffix e.g. _Overlay" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmAddComp('${tier.id}')}"><button class="btn-add" onclick="confirmAddComp('${tier.id}')">+ Add</button></div></div></div>`;
  return h;
}

function renderSidebar(){
  const sb=document.getElementById('sidebarBody');let h='';
  const rootLabel=rootDisplayLabel||'Root Comps',isERN=editingTag&&editingTag.type==='rootName';
  if(!sectionOpen.shots){h+=`<div class="section collapsed-section" onclick="toggleSection('shots')"><div class="section-header collapsed-header"><span class="section-label" style="color:${SHOT_COL.text}" ondblclick="event.stopPropagation();startEditRootName()">● ${rootLabel}</span><div class="header-right">${shots.length?`<span class="tag" style="background:${SHOT_COL.tagBg};color:${SHOT_COL.text};border:1px solid ${SHOT_COL.tagBorder}">${shots.length} comp${shots.length!==1?'s':''}</span>`:`<span class="collapsed-hint">click to expand</span>`}</div></div></div>`}
  else{
    h+=`<div class="section"><div class="section-header">`;
    if(isERN)h+=`<input type="text" id="edit-tag" value="${rootDisplayLabel||''}" placeholder="Root Comps" onkeydown="editKeyHandler(event)" onblur="commitEdit(this)" style="background:transparent;border:none;color:${SHOT_COL.text};font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;outline:none;width:${Math.max(80,rootLabel.length*7+16)}px;font-family:inherit">`;
    else h+=`<span class="section-label" style="color:${SHOT_COL.text}" onclick="toggleSection('shots')" ondblclick="event.stopPropagation();startEditRootName()">● ${rootLabel}</span>`;
    h+=`<div class="header-right">${shots.length?`<span style="font-size:9px;color:#71717a">${shots.length} comp${shots.length!==1?'s':''}</span>`:''}<span style="display:flex;gap:6px;align-items:center">${shots.length?`<button class="btn-clear" onclick="clearShots()">Clear</button>`:''}<button class="tier-btn" onclick="toggleRootSettings()" title="Settings" style="${rootSettingsOpen?'color:#a1a1aa':''}">⚙</button></span></div></div>`;
    h+=renderShotTags();
    h+=`<div class="input-row"><input type="text" id="inp-shots" placeholder="Paste from spreadsheet or type names..." onkeydown="if(event.key==='Enter'){addShot();return;}"><button class="btn-add" onclick="addShot()">+ Add</button></div>`;
    if(rootSettingsOpen){
      h+=`<div class="settings-panel"><div class="suffix-row"><label>Suffix:</label><input type="text" id="inp-root-suffix" value="${rootSuffix}" placeholder="e.g. _Animation (optional)" onchange="updateRootSuffix(this.value)" onkeydown="if(event.key==='Enter')this.blur()"></div>`;
      h+=`<div class="settings-check" style="margin-top:6px;margin-bottom:0"><label><input type="checkbox" ${settings.wrapInFolder?'checked':''} onchange="settings.wrapInFolder=this.checked;renderAll()">Wrap each shot's comps in a folder</label></div>`;
      h+=`<div class="comp-settings"><label>W:<input type="number" id="setW" value="${settings.width}" onchange="settings.width=parseInt(this.value)||1920;syncMirroredTiers();syncMirroredGlobals();renderAll()"></label><label>H:<input type="number" id="setH" value="${settings.height}" onchange="settings.height=parseInt(this.value)||1080;syncMirroredTiers();syncMirroredGlobals();renderAll()"></label><label>FPS:<input type="number" id="setFPS" value="${settings.fps}" step="0.01" onchange="settings.fps=parseFloat(this.value)||30;syncMirroredTiers();syncMirroredGlobals();renderAll()"></label><label>Dur:<input type="number" id="setDur" value="${settings.duration}" onchange="settings.duration=parseFloat(this.value)||10;syncMirroredTiers();syncMirroredGlobals();renderAll()">s</label></div></div>`;
    }
    h+=`</div>`;
  }
  const totalComps=tiers.reduce((s,t)=>s+t.comps.length,0),nestedComps=totalComps*shots.length;
  if(!sectionOpen.tiers){h+=`<div class="section collapsed-section" onclick="toggleSection('tiers')"><div class="section-header collapsed-header"><span class="section-label" style="color:${TIER_COL.text}">● Precomps</span><div class="header-right">${totalComps?`<span class="tag" style="background:${TIER_COL.tagBg};color:${TIER_COL.text};border:1px solid ${TIER_COL.tagBorder}">${tiers.length} group${tiers.length!==1?'s':''}, ${totalComps} comp${totalComps!==1?'s':''}</span>`:`<span class="collapsed-hint">click to expand</span>`}</div></div></div>`}
  else{
    const pp=[];if(tiers.length)pp.push(tiers.length+' group'+(tiers.length!==1?'s':''));if(totalComps)pp.push(totalComps+' comp'+(totalComps!==1?'s':''));if(nestedComps)pp.push(nestedComps+' nested');
    h+=`<div class="section"><div class="section-header"><span class="section-label" style="color:${TIER_COL.text}" onclick="toggleSection('tiers')">● Precomps</span><div class="header-right">${pp.length?`<span style="font-size:9px;color:#71717a">${pp.join(', ')}</span>`:''}<span style="display:flex;gap:6px;align-items:center">${tiers.length?`<button class="btn-clear" onclick="clearTiers()">Reset</button>`:''}</span></div></div>`;
    tiers.forEach((t,i)=>{h+=renderTierCard(t,i)});
    h+=`<div style="margin-top:4px"><button class="btn-add" onclick="addTier()" style="width:100%;text-align:center;padding:8px">+ Add Precomps</button></div></div>`;
  }
  if(!sectionOpen.globals){h+=`<div class="section collapsed-section" onclick="toggleSection('globals')"><div class="section-header collapsed-header"><span class="section-label" style="color:${GLOB_COL.text}">● Global Comps</span><div class="header-right">${globals.length?`<span class="tag" style="background:${GLOB_COL.tagBg};color:${GLOB_COL.text};border:1px solid ${GLOB_COL.tagBorder}">${globals.length} global${globals.length!==1?'s':''}</span>`:`<span class="collapsed-hint">click to expand</span>`}</div></div></div>`}
  else{
    const gTL=globals.length?globals.reduce((s,g)=>s+g.targetComps.filter(t=>t==='root'||compById(t)).length,0)*Math.max(shots.length,1):0;
    h+=`<div class="section"><div class="section-header"><span class="section-label" style="color:${GLOB_COL.text}" onclick="toggleSection('globals')">● Global Comps</span><div class="header-right">${globals.length?`<span style="font-size:9px;color:#71717a">${globals.length} comp${globals.length!==1?'s':''}${gTL?', '+gTL+' nested':''}</span>`:''}<span style="display:flex;gap:6px;align-items:center">${globals.length?`<button class="btn-clear" onclick="clearGlobals()">Clear</button>`:''}<button class="tier-btn" onclick="toggleGlobalSettings()" title="Settings" style="${globalSettingsOpen?'color:#a1a1aa':''}">⚙</button></span></div></div>`;
    if(globalSettingsOpen){
      const gs=getGlobalSettings();
      h+=`<div class="settings-panel"><div class="tier-settings-row" style="border-bottom:none;padding:4px 0">`;
      h+=`<label><input type="checkbox" ${globalSettings.wrapInFolder?'checked':''} onchange="toggleGlobalWrapInFolder()" style="accent-color:#fb7185;width:11px;height:11px;cursor:pointer">Wrap in Folder</label>`;
      h+=`<label><input type="checkbox" ${globalSettings.mirrorRoot?'checked':''} onchange="toggleGlobalMirrorRoot()" style="accent-color:#fb7185;width:11px;height:11px;cursor:pointer">Mirror Root</label>`;
      if(!globalSettings.mirrorRoot)h+=`<label>W:<input type="number" value="${gs.width}" onchange="updateGlobalSetting('width',parseInt(this.value)||1920)"></label><label>H:<input type="number" value="${gs.height}" onchange="updateGlobalSetting('height',parseInt(this.value)||1080)"></label><label>FPS:<input type="number" value="${gs.fps}" step="0.01" onchange="updateGlobalSetting('fps',parseFloat(this.value)||30)"></label><label>Dur:<input type="number" value="${gs.duration}" onchange="updateGlobalSetting('duration',parseFloat(this.value)||10)">s</label>`;
      else h+=`<span class="mirror-summary">${gs.width}×${gs.height} ${gs.fps}fps ${gs.duration}s</span>`;
      h+=`</div></div>`;
    }
    const allOpts=getAllCompOptions();
    globals.forEach((g,gi)=>{
      const isE=editingTag&&editingTag.type==='global'&&editingTag.idx===gi,vt=g.targetComps.filter(tid=>tid==='root'||compById(tid)),lc=vt.length*Math.max(shots.length,1);
      h+=`<div class="global-row" ondragover="onDragOver(event,'global',${gi})" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'global',${gi})"><div class="global-top"><span class="drag-grip" draggable="true" ondragstart="onDragStart(event,'global',${gi})" ondragend="onDragEnd(event)">⠿</span>`;
      if(isE)h+=`<input type="text" id="edit-tag" value="${g.name}" onkeydown="editKeyHandler(event)" onblur="commitEdit(this)" style="background:transparent;border:none;color:#fb7185;font-size:12px;font-weight:600;outline:none;width:${Math.max(60,g.name.length*8+16)}px;font-family:inherit;flex:1">`;
      else h+=`<span class="global-name" style="flex:1" ondblclick="startEditGlobal(${gi})">${g.name}${lc>0?` <span style="font-size:9px;font-weight:normal;color:#52525b">(${lc} nested)</span>`:''}</span>`;
      h+=`<div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><div class="guide-check"><input type="checkbox" id="guide-${g.id}" ${g.guideLayer?'checked':''} onchange="toggleGuideLayer('${g.id}')"><label for="guide-${g.id}">Guide</label></div><button class="tier-btn remove" onclick="removeGlobal(${gi})">×</button></div></div>`;
      h+=`<span class="global-arrow">into</span><div class="global-targets">`;
      let lastTL='';allOpts.forEach(opt=>{if(opt.tierLabel!==lastTL){if(lastTL)h+=`<span class="target-sep"></span>`;lastTL=opt.tierLabel}const active=g.targetComps.includes(opt.id);h+=`<span class="target-chip ${active?'active':''}" onclick="toggleGlobalTarget('${g.id}','${opt.id}')">${opt.label}</span>`});
      h+=`</div></div>`;
    });
    h+=`<div class="input-row" style="margin-top:4px"><input type="text" id="inp-globals" placeholder="e.g. FX_Overlay, Template_Guide" onkeydown="if(event.key==='Enter'){addGlobal();return;}"><button class="btn-add" onclick="addGlobal()">+ Add</button></div></div>`;
  }
  sb.innerHTML=h;
}

function renderAll(){
  const ae=document.activeElement,aId=ae&&ae.tagName==='INPUT'?ae.id:null,aVal=aId?ae.value:'',aSel=aId?[ae.selectionStart,ae.selectionEnd]:null;
  renderSidebar();renderPreview();
  if(aId){const el=document.getElementById(aId);if(el){el.value=aVal;el.focus();if(aSel)el.setSelectionRange(aSel[0],aSel[1])}}
  if(editingTag){const ed=document.getElementById('edit-tag');if(ed){ed.focus();ed.select()}}
}

// ========== EXTENDSCRIPT ==========
function generateScript(){
  const RW=settings.width,RH=settings.height,RFPS=settings.fps,RDUR=settings.duration;
  let lines=[],vc=0;function v(){return'v'+(vc++)}function safe(s){return s.replace(/"/g,'\\"')}
  lines.push('// AE Comp Builder - Generated ExtendScript');lines.push('(function() {');lines.push('  app.beginUndoGroup("Create Comp Pipeline");');lines.push('  var p = app.project;');lines.push('');
  lines.push(`  var RW = ${RW}, RH = ${RH}, RFPS = ${RFPS}, RDUR = ${RDUR};`);
  tiers.forEach((tier,idx)=>{if(!tier.settings||tier.settings.mirrorRoot)return;const ts=getTierSettings(tier);lines.push(`  var T${idx}W = ${ts.width}, T${idx}H = ${ts.height}, T${idx}FPS = ${ts.fps}, T${idx}DUR = ${ts.duration};`)});
  if(!globalSettings.mirrorRoot){const gs=getGlobalSettings();lines.push(`  var GW = ${gs.width}, GH = ${gs.height}, GFPS = ${gs.fps}, GDUR = ${gs.duration};`)}
  lines.push('');

  // Global comps folder
  let globalFolderVar=null;
  if(globalSettings.wrapInFolder&&globals.length){
    globalFolderVar=v();
    lines.push(`  var ${globalFolderVar} = p.rootFolder.items.addFolder("Global Comps");`);
  }

  const gv={};globals.forEach(g=>{const vn=v();gv[g.id]=vn;const gpfx=globalSettings.mirrorRoot?'R':'G';lines.push(`  var ${vn} = p.items.addComp("${safe(g.name)}", ${gpfx}W, ${gpfx}H, 1, ${gpfx}DUR, ${gpfx}FPS);`);lines.push(`  ${vn}.label = 1;`);if(globalFolderVar)lines.push(`  ${vn}.parentFolder = ${globalFolderVar};`)});
  if(globals.length)lines.push('');

  // Group by tier mode folders (created once, outside shot loop)
  let tierByTierFolders={};
  let rootTierFolder=null;
  if(groupMode==='tier'){
    if(shots.length){
      rootTierFolder=v();
      lines.push(`  var ${rootTierFolder} = p.rootFolder.items.addFolder("${safe(rootDisplayLabel||'Root')}");`);
    }
    tiers.forEach((tier,ti)=>{
      if(!tier.comps.length)return;
      const fv=v();
      tierByTierFolders[tier.id]=fv;
      lines.push(`  var ${fv} = p.rootFolder.items.addFolder("${safe(tier.name||('Group '+(ti+1)))}");`);
    });
    lines.push('');
  }

  natSort(shots).forEach(sn=>{
    const s=safe(sn);lines.push(`  // --- ${s} ---`);

    let fv=null;
    if(groupMode==='shot'&&settings.wrapInFolder){
      fv=v();lines.push(`  var ${fv} = p.rootFolder.items.addFolder("${s}");`);
    }

    const rv=v(),rcn=safe(sn+rootSuffix);lines.push(`  var ${rv} = p.items.addComp("${rcn}", RW, RH, 1, RDUR, RFPS);`);lines.push(`  ${rv}.label = 3;`);
    if(groupMode==='shot'&&fv)lines.push(`  ${rv}.parentFolder = ${fv};`);
    else if(groupMode==='tier'&&rootTierFolder)lines.push(`  ${rv}.parentFolder = ${rootTierFolder};`);

    const cvm={'root':rv};
    tiers.forEach((tier,ti)=>{
      let tfv=null;
      if(groupMode==='shot'&&tier.wrapInFolder&&fv){tfv=v();lines.push(`  var ${tfv} = ${fv}.items.addFolder("${safe(tier.name||('Group '+(ti+1)))}");`)}
      const utv=tier.settings&&!tier.settings.mirrorRoot,pfx=utv?'T'+ti:'R';
      tier.comps.forEach(comp=>{const cv=v();cvm[comp.id]=cv;const cn=safe(sn+comp.suffix);lines.push(`  var ${cv} = p.items.addComp("${cn}", ${pfx}W, ${pfx}H, 1, ${pfx}DUR, ${pfx}FPS);`);lines.push(`  ${cv}.label = 4;`);
        if(groupMode==='shot'){if(tfv)lines.push(`  ${cv}.parentFolder = ${tfv};`);else if(fv)lines.push(`  ${cv}.parentFolder = ${fv};`)}
        else if(groupMode==='tier'&&tierByTierFolders[tier.id])lines.push(`  ${cv}.parentFolder = ${tierByTierFolders[tier.id]};`);
        getEffectiveSources(comp,ti).forEach(sid=>{if(cvm[sid])lines.push(`  ${cv}.layers.add(${cvm[sid]});`)})});
    });
    globals.forEach(g=>{g.targetComps.forEach(tid=>{if(cvm[tid]&&gv[g.id]){if(g.guideLayer){const lv='lyr'+(vc++);lines.push(`  var ${lv} = ${cvm[tid]}.layers.add(${gv[g.id]});`);lines.push(`  ${lv}.guideLayer = true;`)}else lines.push(`  ${cvm[tid]}.layers.add(${gv[g.id]});`)}})});
    lines.push('');
  });
  lines.push('  app.endUndoGroup();');lines.push(`  alert("Created ${shots.length*(1+tiers.reduce((s,t)=>s+t.comps.length,0))+globals.length} compositions!");`);lines.push('})();');
  return lines.join('\n');
}
function exportScript(){const s=generateScript(),b=new Blob([s],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ae_comp_structure.jsx';a.click();URL.revokeObjectURL(a.href)}

// ========== INIT ==========
(function(){const t={id:'tier_'+tierIdCounter++,name:null,comps:[],wrapInFolder:false,settings:makeTierSettings()};tiers.push(t);renderAll();requestAnimationFrame(()=>{const inp=document.getElementById('inp-tier-comp-'+t.id);if(inp)inp.focus()})})();
</script>
